<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4efe7;
    }

    /* ОСНОВНАЯ СЦЕНА */

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background-image: url("fon.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* НАЗВАНИЕ */

    .game-title {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;

      background: rgba(255,255,255,.92);
      padding: 10px 28px;
      border-radius: 18px;

      font-size: clamp(20px, 2vw, 34px);
      font-weight: 800;
      color: #70472a;

      box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }

    /* ЗОНА ШКАФОВ */

    .shelves {
      position: absolute;

      left: 2%;
      bottom: 13%;

      width: 70%;
      height: 60%;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 2%;
      z-index: 5;
    }

    /* ОБЁРТКА КАЖДОГО ШКАФА */

    .shelf-wrap {
      position: relative;

      width: 31%;
      height: 100%;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* КАРТИНКА ШКАФА */

    .shelf {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: bottom center;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;

      z-index: 1;
    }

    /* ТОВАРЫ НА ПЕРВОМ ШКАФУ */

    .products-grid {
      position: absolute;

      left: 10%;
      right: 10%;

      top: 16%;
      bottom: 12%;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);

      gap: 4% 5%;

      align-items: center;
      justify-items: center;

      z-index: 3;
    }

    .product {
      width: 72%;
      height: 72%;

      object-fit: contain;

      cursor: pointer;

      transition:
        transform .18s ease,
        filter .18s ease;

      user-select: none;
      -webkit-user-drag: none;
    }

    .product:hover {
      transform: scale(1.12);
      filter: brightness(1.05);
    }

    .product:active {
      transform: scale(.95);
    }

    /* ПРАВАЯ ЗОНА */

    .right-zone {
      position: absolute;

      right: 1.2%;
      top: 11%;
      bottom: 2%;

      width: 27%;

      z-index: 20;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* СПИСОК */

    .shopping-list {
      width: 100%;

      background: rgba(255,255,255,.93);

      border-radius: 22px;

      box-shadow: 0 6px 18px rgba(0,0,0,.12);

      padding: 16px 18px;

      color: #70472a;
    }

    .shopping-list h3 {
      margin: 0 0 12px;

      text-align: center;

      font-size: clamp(18px, 1.5vw, 26px);
    }

    .list-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #fffaf4;

      border: 2px solid #efdcc7;
      border-radius: 14px;

      padding: 8px 12px;

      font-size: 18px;
      font-weight: 700;
    }

    .list-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-icon {
      font-size: 30px;
    }

    /* ПОКУПАТЕЛЬ */

    .buyer-zone {
      position: relative;

      width: 100%;
      height: 53%;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      overflow: visible;
    }

    .buyer-img {
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      display: block;

      transition:
        transform .75s ease,
        opacity .75s ease;

      opacity: 1;
    }

    .buyer-img.enter {
      animation: buyerEnter .75s ease-out;
    }

    .buyer-img.exit {
      transform: translateX(130%);
      opacity: 0;
    }

    @keyframes buyerEnter {
      from {
        transform: translateX(130%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* КНОПКИ */

    .controls {
      position: absolute;

      left: 50%;
      bottom: 2%;

      transform: translateX(-50%);

      z-index: 50;

      display: flex;
      gap: 12px;
    }

    .btn {
      border: none;

      padding: 14px 22px;

      border-radius: 16px;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 5px 12px rgba(0,0,0,.14);
    }

    .btn-check {
      background: #66bb6a;
      color: white;
    }

    .btn-next {
      background: #ffca5b;
      color: #5b4027;
    }

    /* СООБЩЕНИЕ */

    .message {
      position: absolute;

      left: 50%;
      top: 10%;

      transform: translateX(-50%);

      z-index: 60;

      background: rgba(255,255,255,.95);

      border-radius: 14px;

      padding: 10px 18px;

      font-weight: 800;

      color: #7b4b2c;

      opacity: 0;

      pointer-events: none;

      transition: opacity .25s;
    }

    .message.show {
      opacity: 1;
    }

    @media (max-width: 1100px) {
      .shelves {
        width: 68%;
        height: 56%;
        bottom: 13%;
      }

      .right-zone {
        width: 29%;
      }

      .buyer-zone {
        height: 50%;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <div class="game-title">
      Магазин
    </div>

    <div class="message" id="message">
      Готово!
    </div>

    <!-- ТРИ ШКАФА -->

    <div class="shelves">

      <!-- ШКАФ 1 С 9 ТОВАРАМИ -->

      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

        <div class="products-grid">

          <img src="assets/products/pik-01.png" class="product" data-id="pik-01" alt="">
          <img src="assets/products/pik-02.png" class="product" data-id="pik-02" alt="">
          <img src="assets/products/pik-03.png" class="product" data-id="pik-03" alt="">

          <img src="assets/products/pik-04.png" class="product" data-id="pik-04" alt="">
          <img src="assets/products/pik-05.png" class="product" data-id="pik-05" alt="">
          <img src="assets/products/pik-06.png" class="product" data-id="pik-06" alt="">

          <img src="assets/products/pik-07.png" class="product" data-id="pik-07" alt="">
          <img src="assets/products/pik-08.png" class="product" data-id="pik-08" alt="">
          <img src="assets/products/pik-09.png" class="product" data-id="pik-09" alt="">

        </div>

      </div>

      <!-- ШКАФ 2 -->

      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

      </div>

      <!-- ШКАФ 3 -->

      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

      </div>

    </div>

    <!-- ПРАВАЯ ЗОНА -->

    <div class="right-zone">

      <div class="shopping-list">

        <h3>
          Список покупок
        </h3>

        <div
          id="listItems"
          class="list-items">
        </div>

      </div>

      <div class="buyer-zone">

        <img
          id="buyerImage"
          class="buyer-img"
          src="assets/buyers/buyer-cart-01.png"
          alt="Покупатель с тележкой"
        >

      </div>

    </div>

    <!-- КНОПКИ -->

    <div class="controls">

      <button
        id="checkBtn"
        class="btn btn-check">
        Проверить
      </button>

      <button
        id="nextBtn"
        class="btn btn-next">
        Следующий покупатель
      </button>

    </div>

  </div>

  <script>

    const BUYERS = [
      {
        image: "assets/buyers/buyer-cart-01.png",
        list: [
          { name: "Покупка 1", icon: "🛍️", need: 2 },
          { name: "Покупка 2", icon: "🛍️", need: 1 },
          { name: "Покупка 3", icon: "🛍️", need: 3 }
        ]
      },

      {
        image: "assets/buyers/buyer-cart-02.png",
        list: [
          { name: "Покупка 1", icon: "🛍️", need: 1 },
          { name: "Покупка 2", icon: "🛍️", need: 2 },
          { name: "Покупка 3", icon: "🛍️", need: 2 }
        ]
      },

      {
        image: "assets/buyers/buyer-cart-03.png",
        list: [
          { name: "Покупка 1", icon: "🛍️", need: 3 },
          { name: "Покупка 2", icon: "🛍️", need: 1 },
          { name: "Покупка 3", icon: "🛍️", need: 2 }
        ]
      },

      {
        image: "assets/buyers/buyer-cart-04.png",
        list: [
          { name: "Покупка 1", icon: "🛍️", need: 2 },
          { name: "Покупка 2", icon: "🛍️", need: 2 },
          { name: "Покупка 3", icon: "🛍️", need: 1 }
        ]
      }
    ];

    let currentBuyer = 0;

    const buyerImage =
      document.getElementById("buyerImage");

    const listItems =
      document.getElementById("listItems");

    const message =
      document.getElementById("message");

    function renderList() {

      const buyer =
        BUYERS[currentBuyer];

      listItems.innerHTML = "";

      buyer.list.forEach(item => {

        const row =
          document.createElement("div");

        row.className =
          "list-row";

        row.innerHTML = `
          <div class="list-left">
            <span class="list-icon">
              ${item.icon}
            </span>

            <span>
              ${item.name}
            </span>
          </div>

          <span>
            × ${item.need}
          </span>
        `;

        listItems.appendChild(row);

      });

    }

    function renderBuyer() {

      const buyer =
        BUYERS[currentBuyer];

      buyerImage.src =
        buyer.image;

      buyerImage.classList.remove("enter");

      void buyerImage.offsetWidth;

      buyerImage.classList.add("enter");

      renderList();
    }

    function nextBuyer() {

      buyerImage.classList.add("exit");

      setTimeout(() => {

        currentBuyer++;

        if (currentBuyer >= BUYERS.length) {
          currentBuyer = 0;
        }

        buyerImage.classList.remove("exit");

        renderBuyer();

        showMessage("Пришёл новый покупатель!");

      }, 750);

    }

    function showMessage(text) {

      message.textContent =
        text;

      message.classList.add("show");

      setTimeout(() => {
        message.classList.remove("show");
      }, 1500);

    }

    /* ТЕСТ КЛИКА ПО ТОВАРУ */

    document
      .querySelectorAll(".product")
      .forEach(product => {

        product.addEventListener(
          "click",
          () => {

            showMessage(
              "Вы выбрали " +
              product.dataset.id
            );

          }
        );

      });

    document
      .getElementById("nextBtn")
      .addEventListener(
        "click",
        nextBuyer
      );

    document
      .getElementById("checkBtn")
      .addEventListener(
        "click",
        () => {

          showMessage(
            "Следующим шагом подключим список покупок и полёт товара в тележку."
          );

        }
      );

    renderBuyer();

  </script>

</body>
</html>
