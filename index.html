<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин — покупатель с тележкой</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #edf5f8;
      color: #2f3a40;
    }

    .game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 3px solid #d7e3ea;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #35637b;
    }

    .buyer-counter {
      background: #fff7d8;
      border: 2px solid #e1cb7d;
      border-radius: 14px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 18px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .panel {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 18px;
    }

    .panel h2 {
      margin-top: 0;
      color: #35637b;
    }

    /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */

    .shopping-list {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #shoppingList {
      flex: 1;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 2px solid #e9f0f4;
      border-radius: 16px;
      margin-bottom: 10px;
      background: #fafcfd;
    }

    .list-item.done {
      background: #e7f8ea;
      border-color: #8fd29f;
    }

    .list-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .list-emoji {
      font-size: 34px;
      width: 42px;
      text-align: center;
    }

    .list-name {
      font-weight: 700;
      font-size: 18px;
    }

    .list-qty {
      font-size: 14px;
      color: #6d7e89;
      margin-top: 2px;
    }

    .list-progress {
      font-weight: 800;
      min-width: 68px;
      text-align: right;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: #4caf50;
      color: #fff;
    }

    .btn-secondary {
      background: #dde7ec;
      color: #324550;
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      font-weight: 700;
      color: #9b5c00;
    }

    .message.success {
      color: #17833e;
    }

    .message.error {
      color: #b54343;
    }

    /* ===== СЦЕНА МАГАЗИНА ===== */

    .store-wrap {
      position: relative;
      min-height: 700px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #dff2ff 0 22%, #fbfdff 22% 36%, #f5efe5 36% 100%);
      border-radius: 24px;
      padding: 20px;
    }

    .store-title {
      font-size: 30px;
      font-weight: 800;
      color: #35637b;
      margin-bottom: 12px;
    }

    .store-scene {
      position: relative;
      min-height: 620px;
    }

    .shelves-area {
      width: calc(100% - 260px);
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 18px;
      align-content: start;
    }

    .shelf {
      background: #c78750;
      border: 3px solid #9c6338;
      border-radius: 18px;
      padding: 12px;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.08);
    }

    .shelf-title {
      text-align: center;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .product-btn {
      min-height: 94px;
      background: #fff;
      border: 2px solid #dbe5ea;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }

    .product-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.08);
    }

    .product-btn .icon {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .product-btn.correct {
      background: #e8f8ec;
      border-color: #8ccf99;
    }

    .product-btn.wrong {
      background: #ffe8e8;
      border-color: #e69898;
      animation: shake .25s;
    }

    @keyframes shake {
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    /* ===== ПОКУПАТЕЛЬ ===== */

    .buyer-scene {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }

    .buyer-scene.enter {
      animation: buyerEnter 0.8s ease-out;
    }

    @keyframes buyerEnter {
      0% {
        transform: translateX(220px);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .buyer-name {
      background: #ffffff;
      border: 2px solid #d9e6eb;
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
    }

    .buyer-with-cart {
      display: flex;
      align-items: end;
      gap: 8px;
    }

    .buyer-avatar {
      font-size: 92px;
      line-height: 1;
    }

    .cart-visual {
      position: relative;
      width: 108px;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-body {
      position: absolute;
      left: 8px;
      top: 10px;
      width: 72px;
      height: 34px;
      border: 4px solid #788a95;
      border-top-width: 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      transform: skewX(-10deg);
    }

    .cart-handle {
      position: absolute;
      right: 14px;
      top: 2px;
      width: 22px;
      height: 32px;
      border-right: 5px solid #788a95;
      border-top: 5px solid #788a95;
      border-radius: 0 8px 0 0;
    }

    .wheel1, .wheel2 {
      position: absolute;
      bottom: 0;
      width: 14px;
      height: 14px;
      background: #4b5a63;
      border-radius: 50%;
    }

    .wheel1 { left: 20px; }
    .wheel2 { left: 58px; }

    .cart-items-small {
      position: absolute;
      left: 16px;
      top: 6px;
      width: 56px;
      min-height: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-content: flex-start;
      justify-content: center;
      font-size: 14px;
      z-index: 2;
      pointer-events: none;
    }

    .list-attached {
      width: 100%;
      background: #fffef8;
      border: 2px dashed #d6c998;
      border-radius: 16px;
      padding: 10px 12px;
    }

    .list-attached-title {
      font-size: 14px;
      font-weight: 800;
      color: #7b6a29;
      margin-bottom: 8px;
      text-align: center;
    }

    .mini-list-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      padding: 4px 0;
      border-bottom: 1px dashed #eee4bc;
    }

    .mini-list-row:last-child {
      border-bottom: none;
    }

    .mini-list-row.done {
      color: #17833e;
      font-weight: 800;
    }

    /* ===== ЛЕТЯЩИЙ ТОВАР ===== */

    .flying-item {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 34px;
      line-height: 1;
      transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s linear;
    }

    /* ===== МОДАЛКИ ===== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    }

    .big-icon {
      font-size: 68px;
      margin-bottom: 8px;
    }

    .payment-box {
      background: #eef5f8;
      border: 2px solid #d4e1e8;
      border-radius: 18px;
      padding: 18px;
      margin: 16px 0;
    }

    .amount {
      font-size: 28px;
      font-weight: 800;
      color: #35637b;
      margin: 10px 0;
    }

    .modal-result {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #17833e;
      min-height: 24px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .store-wrap {
        min-height: 980px;
      }

      .shelves-area {
        width: 100%;
        padding-bottom: 320px;
      }

      .buyer-scene {
        right: 50%;
        transform: translateX(50%);
      }

      .buyer-scene.enter {
        animation: buyerEnterMobile 0.8s ease-out;
      }

      @keyframes buyerEnterMobile {
        0% {
          transform: translateX(200px);
          opacity: 0;
        }
        100% {
          transform: translateX(50%);
          opacity: 1;
        }
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <div class="title">Игра «Покупки в магазине»</div>
      <div class="buyer-counter" id="buyerCounter">Покупатель 1 из 2</div>
    </div>

    <div class="layout">
      <!-- ЛЕВАЯ ПАНЕЛЬ -->
      <div class="panel shopping-list">
        <h2>Список покупок</h2>
        <div id="shoppingList"></div>

        <div class="actions">
          <button class="btn-primary" id="checkBtn">Проверить</button>
          <button class="btn-secondary" id="clearBtn">Очистить</button>
        </div>

        <div class="message" id="messageBox"></div>
      </div>

      <!-- ПРАВАЯ ПАНЕЛЬ -->
      <div class="panel">
        <div class="store-wrap">
          <div class="store-title">Магазин</div>

          <div class="store-scene">
            <div class="shelves-area" id="shelvesArea"></div>

            <div class="buyer-scene" id="buyerScene">
              <div class="buyer-name" id="buyerName">Покупатель</div>

              <div class="buyer-with-cart">
                <div class="buyer-avatar" id="buyerAvatar">🧍</div>

                <div class="cart-visual">
                  <div class="cart-body"></div>
                  <div class="cart-handle"></div>
                  <div class="wheel1"></div>
                  <div class="wheel2"></div>

                  <div class="cart-items-small" id="cartItemsSmall"></div>
                </div>
              </div>

              <div class="list-attached">
                <div class="list-attached-title">Список у покупателя</div>
                <div id="miniShoppingList"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- КАССА -->
    <div class="modal" id="paymentModal">
      <div class="modal-card">
        <div class="big-icon">💁‍♀️💳</div>
        <h2>Касса</h2>
        <p>Все товары собраны. Теперь оплатите покупку картой.</p>

        <div class="payment-box">
          <div style="font-size:56px;">🏧</div>
          <div class="amount" id="paymentAmount">Сумма: 0 ₽</div>
          <div>Нажмите кнопку ниже для оплаты.</div>
        </div>

        <div class="actions" style="justify-content:center;">
          <button class="btn-primary" id="payBtn">Оплатить картой</button>
        </div>

        <div class="modal-result" id="paymentResult"></div>
      </div>
    </div>

    <!-- ФИНАЛ -->
    <div class="modal" id="finishModal">
      <div class="modal-card">
        <div class="big-icon">🎉</div>
        <h2>Все покупатели обслужены!</h2>
        <p>Игра завершена.</p>

        <div class="actions" style="justify-content:center;">
          <button class="btn-primary" id="restartBtn">Сыграть ещё раз</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== КАТАЛОГ =====
    const PRODUCT_CATALOG = {
      banana:   { name: "Банан",     emoji: "🍌", price: 40 },
      apple:    { name: "Яблоко",    emoji: "🍎", price: 25 },
      potato:   { name: "Картошка",  emoji: "🥔", price: 20 },
      milk:     { name: "Молоко",    emoji: "🥛", price: 85 },
      bread:    { name: "Хлеб",      emoji: "🍞", price: 55 },
      cheese:   { name: "Сыр",       emoji: "🧀", price: 120 },
      tomato:   { name: "Помидор",   emoji: "🍅", price: 35 },
      carrot:   { name: "Морковь",   emoji: "🥕", price: 18 },
      pear:     { name: "Груша",     emoji: "🍐", price: 30 },
      grapes:   { name: "Виноград",  emoji: "🍇", price: 60 },
      cucumber: { name: "Огурец",    emoji: "🥒", price: 22 },
      cake:     { name: "Торт",      emoji: "🍰", price: 240 }
    };

    const SHELVES = [
      { title: "Фрукты",   products: ["banana", "apple", "pear", "grapes"] },
      { title: "Овощи",    products: ["potato", "tomato", "carrot", "cucumber"] },
      { title: "Молочное", products: ["milk", "cheese", "bread", "cake"] },
      { title: "Ещё товары", products: ["apple", "banana", "tomato", "bread"] }
    ];

    const BUYERS = [
      {
        name: "Покупатель 1",
        avatar: "🧍",
        shoppingList: {
          banana: 2,
          apple: 3,
          potato: 4
        }
      },
      {
        name: "Покупатель 2",
        avatar: "🧑",
        shoppingList: {
          milk: 1,
          bread: 2,
          tomato: 3
        }
      }
    ];

    // ===== СОСТОЯНИЕ =====
    let currentBuyerIndex = 0;
    let cart = {};
    let isAnimating = false;

    // ===== ЭЛЕМЕНТЫ =====
    const shoppingListEl = document.getElementById("shoppingList");
    const miniShoppingListEl = document.getElementById("miniShoppingList");
    const shelvesAreaEl = document.getElementById("shelvesArea");
    const cartItemsSmallEl = document.getElementById("cartItemsSmall");
    const buyerCounterEl = document.getElementById("buyerCounter");
    const buyerNameEl = document.getElementById("buyerName");
    const buyerAvatarEl = document.getElementById("buyerAvatar");
    const buyerSceneEl = document.getElementById("buyerScene");
    const messageBoxEl = document.getElementById("messageBox");

    const checkBtn = document.getElementById("checkBtn");
    const clearBtn = document.getElementById("clearBtn");

    const paymentModal = document.getElementById("paymentModal");
    const paymentAmountEl = document.getElementById("paymentAmount");
    const paymentResultEl = document.getElementById("paymentResult");
    const payBtn = document.getElementById("payBtn");

    const finishModal = document.getElementById("finishModal");
    const restartBtn = document.getElementById("restartBtn");

    // ===== ВСПОМОГАТЕЛЬНЫЕ =====
    function getCurrentBuyer() {
      return BUYERS[currentBuyerIndex];
    }

    function setMessage(text, type = "") {
      messageBoxEl.textContent = text;
      messageBoxEl.className = "message";
      if (type) {
        messageBoxEl.classList.add(type);
      }
    }

    function totalCartCount() {
      return Object.values(cart).reduce((sum, qty) => sum + qty, 0);
    }

    function calculateTotal() {
      let total = 0;
      for (const key in cart) {
        total += PRODUCT_CATALOG[key].price * cart[key];
      }
      return total;
    }

    // ===== РЕНДЕР =====
    function renderBuyer() {
      const buyer = getCurrentBuyer();
      buyerCounterEl.textContent = `Покупатель ${currentBuyerIndex + 1} из ${BUYERS.length}`;
      buyerNameEl.textContent = buyer.name;
      buyerAvatarEl.textContent = buyer.avatar;

      buyerSceneEl.classList.remove("enter");
      void buyerSceneEl.offsetWidth;
      buyerSceneEl.classList.add("enter");
    }

    function renderShoppingLists() {
      const buyer = getCurrentBuyer();
      const list = buyer.shoppingList;

      shoppingListEl.innerHTML = "";
      miniShoppingListEl.innerHTML = "";

      Object.keys(list).forEach(key => {
        const product = PRODUCT_CATALOG[key];
        const need = list[key];
        const have = cart[key] || 0;
        const done = have === need;

        const row = document.createElement("div");
        row.className = "list-item" + (done ? " done" : "");
        row.innerHTML = `
          <div class="list-left">
            <div class="list-emoji">${product.emoji}</div>
            <div>
              <div class="list-name">${product.name}</div>
              <div class="list-qty">Нужно: ${need}</div>
            </div>
          </div>
          <div class="list-progress">${have} / ${need}</div>
        `;
        shoppingListEl.appendChild(row);

        const mini = document.createElement("div");
        mini.className = "mini-list-row" + (done ? " done" : "");
        mini.innerHTML = `
          <span>${product.emoji} ${product.name}</span>
          <span>${have}/${need}${done ? " ✓" : ""}</span>
        `;
        miniShoppingListEl.appendChild(mini);
      });
    }

    function renderShelves() {
      shelvesAreaEl.innerHTML = "";

      SHELVES.forEach(shelfData => {
        const shelf = document.createElement("div");
        shelf.className = "shelf";

        const title = document.createElement("div");
        title.className = "shelf-title";
        title.textContent = shelfData.title;

        const grid = document.createElement("div");
        grid.className = "shelf-grid";

        shelfData.products.forEach(key => {
          const product = PRODUCT_CATALOG[key];
          const btn = document.createElement("button");
          btn.className = "product-btn";
          btn.dataset.key = key;
          btn.innerHTML = `
            <div class="icon">${product.emoji}</div>
            <div>${product.name}</div>
          `;

          btn.addEventListener("click", () => handleProductClick(key, btn));
          grid.appendChild(btn);
        });

        shelf.appendChild(title);
        shelf.appendChild(grid);
        shelvesAreaEl.appendChild(shelf);
      });
    }

    function renderCartInTrolley() {
      cartItemsSmallEl.innerHTML = "";

      const total = totalCartCount();
      if (total === 0) return;

      for (const key in cart) {
        const qty = cart[key];
        for (let i = 0; i < qty; i++) {
          const span = document.createElement("span");
          span.textContent = PRODUCT_CATALOG[key].emoji;
          cartItemsSmallEl.appendChild(span);
        }
      }
    }

    // ===== ЛОГИКА =====
    function handleProductClick(productKey, buttonEl) {
      if (isAnimating) return;

      const buyer = getCurrentBuyer();
      const need = buyer.shoppingList[productKey];
      const have = cart[productKey] || 0;

      buttonEl.classList.remove("wrong", "correct");
      void buttonEl.offsetWidth;

      if (!need) {
        buttonEl.classList.add("wrong");
        setMessage("Этот продукт не нужен покупателю.", "error");
        return;
      }

      if (have >= need) {
        buttonEl.classList.add("wrong");
        setMessage("Этого товара уже достаточно.", "error");
        return;
      }

      animateProductToCart(buttonEl, productKey, () => {
        cart[productKey] = (cart[productKey] || 0) + 1;
        buttonEl.classList.add("correct");
        renderShoppingLists();
        renderCartInTrolley();
        setMessage(`Добавлено: ${PRODUCT_CATALOG[productKey].name}.`, "success");
      });
    }

    function animateProductToCart(sourceButton, productKey, onDone) {
      isAnimating = true;

      const iconEl = sourceButton.querySelector(".icon");
      const sourceRect = iconEl.getBoundingClientRect();
      const targetRect = cartItemsSmallEl.getBoundingClientRect();

      const flying = document.createElement("div");
      flying.className = "flying-item";
      flying.textContent = PRODUCT_CATALOG[productKey].emoji;

      flying.style.left = sourceRect.left + sourceRect.width / 2 + "px";
      flying.style.top = sourceRect.top + sourceRect.height / 2 + "px";
      flying.style.transform = "translate(-50%, -50%) scale(1)";
      flying.style.opacity = "1";

      document.body.appendChild(flying);

      requestAnimationFrame(() => {
        const targetX = targetRect.left + targetRect.width / 2;
        const targetY = targetRect.top + targetRect.height / 2;

        flying.style.left = targetX + "px";
        flying.style.top = targetY + "px";
        flying.style.transform = "translate(-50%, -50%) scale(0.35)";
        flying.style.opacity = "0.4";
      });

      setTimeout(() => {
        flying.remove();
        onDone();
        isAnimating = false;
      }, 720);
    }

    function clearCart() {
      cart = {};
      renderShoppingLists();
      renderCartInTrolley();
      setMessage("Тележка очищена.");
    }

    function isOrderCorrect() {
      const buyer = getCurrentBuyer();
      const list = buyer.shoppingList;

      const listKeys = Object.keys(list);
      const cartKeys = Object.keys(cart);

      if (listKeys.length !== cartKeys.length) return false;

      for (const key of listKeys) {
        if ((cart[key] || 0) !== list[key]) {
          return false;
        }
      }

      return true;
    }

    function getProblemsText() {
      const buyer = getCurrentBuyer();
      const list = buyer.shoppingList;
      const problems = [];

      Object.keys(list).forEach(key => {
        const need = list[key];
        const have = cart[key] || 0;

        if (have < need) {
          problems.push(`Не хватает: ${PRODUCT_CATALOG[key].name} (${have}/${need})`);
        } else if (have > need) {
          problems.push(`Лишнее количество: ${PRODUCT_CATALOG[key].name} (${have}/${need})`);
        }
      });

      Object.keys(cart).forEach(key => {
        if (!list[key]) {
          problems.push(`Лишний товар: ${PRODUCT_CATALOG[key].name}`);
        }
      });

      return problems.join(" | ");
    }

    function checkOrder() {
      if (totalCartCount() === 0) {
        setMessage("Тележка пустая. Сначала соберите товары.", "error");
        return;
      }

      if (isOrderCorrect()) {
        setMessage("Всё собрано правильно. Переходим на кассу.", "success");
        openPayment();
      } else {
        setMessage("Проверьте покупки. " + getProblemsText(), "error");
      }
    }

    function openPayment() {
      paymentResultEl.textContent = "";
      paymentAmountEl.textContent = `Сумма: ${calculateTotal()} ₽`;
      paymentModal.classList.add("show");
    }

    function payByCard() {
      paymentResultEl.textContent = "Оплата прошла успешно!";
      setTimeout(() => {
        paymentModal.classList.remove("show");
        nextBuyer();
      }, 1200);
    }

    function nextBuyer() {
      currentBuyerIndex++;

      if (currentBuyerIndex >= BUYERS.length) {
        finishModal.classList.add("show");
        return;
      }

      cart = {};
      initRound();
      setMessage("Пришёл следующий покупатель.", "success");
    }

    function restartGame() {
      currentBuyerIndex = 0;
      cart = {};
      finishModal.classList.remove("show");
      paymentModal.classList.remove("show");
      initRound();
      setMessage("Игра началась заново.");
    }

    function initRound() {
      renderBuyer();
      renderShoppingLists();
      renderShelves();
      renderCartInTrolley();
    }

    // ===== СОБЫТИЯ =====
    checkBtn.addEventListener("click", checkOrder);
    clearBtn.addEventListener("click", clearCart);
    payBtn.addEventListener("click", payByCard);
    restartBtn.addEventListener("click", restartGame);

    // ===== СТАРТ =====
    initRound();
    setMessage("Выбирайте товары мышкой — они полетят в тележку покупателя.");
  </script>
</body>
</html>
