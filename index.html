<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Магазин</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================
   ОСНОВНАЯ СЦЕНА
========================= */

.game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background-image: url("fon.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* =========================
   ШКАФЫ
========================= */

.shelves {

    position: absolute;

    left: 3%;
    right: 3%;

    bottom: 5%;

    height: 72%;

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 2%;

}


/* ОДИН ШКАФ */

.shelf {

    width: 31%;

    height: 100%;

    object-fit: contain;

    object-position: bottom;

    user-select: none;

    pointer-events: none;

}


/* =========================
   ЗАГОЛОВОК
========================= */

.title {

    position: absolute;

    top: 2.5%;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,.92);

    padding: 12px 30px;

    border-radius: 20px;

    font-size: clamp(20px, 2vw, 34px);

    font-weight: 800;

    color: #6c4527;

    box-shadow: 0 5px 15px rgba(0,0,0,.12);

}


/* =========================
   ВРЕМЕННЫЕ ТОВАРЫ
   только для проверки
========================= */

.product {

    position: absolute;

    font-size: clamp(34px, 4vw, 65px);

    cursor: pointer;

    transition: .2s;

    z-index: 10;

}

.product:hover {

    transform: scale(1.15);

}


/* =========================
   ПОКУПАТЕЛЬ
   пока временный
========================= */

.buyer {

    position: absolute;

    right: 2%;

    bottom: 1%;

    font-size: 80px;

    z-index: 20;

}


/* =========================
   ТЕЛЕЖКА
========================= */

.cart {

    position: absolute;

    right: 8%;

    bottom: 1%;

    font-size: 75px;

    z-index: 20;

}

</style>

</head>


<body>


<div class="game">


    <div class="title">
        Магазин
    </div>


    <!-- ======================
         ТРИ ОДИНАКОВЫХ ШКАФА
    ======================= -->

    <div class="shelves">


        <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt="Полка">


        <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt="Полка">


        <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt="Полка">


    </div>



</div>


</body>

</html>
