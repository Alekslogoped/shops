<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4efe7;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background-image: url("fon.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .game-title {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;

      background: rgba(255,255,255,.92);
      padding: 10px 28px;
      border-radius: 18px;

      font-size: clamp(20px, 2vw, 34px);
      font-weight: 800;
      color: #70472a;

      box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }

    /* =========================
       ШКАФЫ
    ========================= */

    .shelves {
      position: absolute;
      left: 2%;
      bottom: 13%;
      width: 70%;
      height: 60%;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2%;

      z-index: 5;
    }

    .shelf-wrap {
      position: relative;
      width: 31%;
      height: 100%;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .shelf {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: bottom center;

      pointer-events: none;
      user-select: none;

      z-index: 1;
    }

    .products-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .product {
      position: absolute;
      object-fit: contain;

      cursor: pointer;

      user-select: none;
      -webkit-user-drag: none;

      transition:
        transform .18s ease,
        filter .18s ease;

      transform-origin: bottom center;
    }

    .product:hover {
      transform: scale(1.08);
      filter: brightness(1.04);
    }

    .product:active {
      transform: scale(.97);
    }

    .product.correct-pulse {
      animation: correctPulse .35s ease;
    }

    .product.wrong-shake {
      animation: wrongShake .4s ease;
    }

    @keyframes correctPulse {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(1.4); }
      100% { filter: brightness(1); }
    }

    @keyframes wrongShake {
      0%   { margin-left: 0; }
      20%  { margin-left: -8px; }
      40%  { margin-left: 8px; }
      60%  { margin-left: -6px; }
      80%  { margin-left: 6px; }
      100% { margin-left: 0; }
    }

    /* =========================
       ПЕРВЫЙ ШКАФ
    ========================= */

    .p1 { left: 6.5%; bottom: 55.5%; width: 27%; }
    .p2 { left: 38%; bottom: 55.5%; width: 24%; }
    .p3 { left: 67%; bottom: 54.8%; width: 28%; }

    .p4 { left: 6%; bottom: 36.5%; width: 27%; }
    .p5 { left: 35%; bottom: 37%; width: 28%; }
    .p6 { left: 67%; bottom: 36.2%; width: 27%; }

    .p7 { left: 5%; bottom: 20.5%; width: 26%; }
    .p8 { left: 34%; bottom: 18.5%; width: 28%; }
    .p9 { left: 64%; bottom: 20%; width: 25%; }

    /* =========================
       ВТОРОЙ ШКАФ
    ========================= */

    .q1 { left: 8%; bottom: 56%; width: 24%; }
    .q2 { left: 38%; bottom: 57%; width: 25%; }

    .q3 {
      left: 68%;
      bottom: 56%;
      width: 25%;
      transform: rotate(-8deg);
    }

    .q3:hover {
      transform: rotate(-8deg) scale(1.08);
    }

    .q3:active {
      transform: rotate(-8deg) scale(.97);
    }

    .q4 { left: 8%; bottom: 37%; width: 25%; }
    .q5 { left: 38%; bottom: 36%; width: 23%; }
    .q6 { left: 67%; bottom: 37%; width: 26%; }

    .q7 { left: 7%; bottom: 19%; width: 25%; }
    .q8 { left: 37%; bottom: 19%; width: 25%; }
    .q9 { left: 68%; bottom: 19%; width: 24%; }

    /* =========================
       ТРЕТИЙ ШКАФ
    ========================= */

    .r1 { left: 7%; bottom: 54.5%; width: 25%; }
    .r2 { left: 37%; bottom: 54%; width: 24%; }
    .r3 { left: 68%; bottom: 55%; width: 24%; }

    .r4 { left: 8%; bottom: 36.5%; width: 24%; }
    .r5 { left: 37%; bottom: 36%; width: 25%; }
    .r6 { left: 68%; bottom: 35.5%; width: 25%; }

    .r7 { left: 7%; bottom: 19%; width: 25%; }
    .r8 { left: 37%; bottom: 18.5%; width: 24%; }
    .r9 { left: 68%; bottom: 19%; width: 24%; }

    /* =========================
       СПИСОК ПОКУПОК
       ПРАВЕЕ И МЕНЬШЕ
    ========================= */

    .shopping-list {
      position: absolute;

      top: 0.8%;
      right: 1.2%;
      left: auto;

      width: 34%;
      aspect-ratio: 1600 / 900;

      background-image:
        url("assets/ui/shopping-list-horizontal.png");

      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 14;
    }

    .list-items {
      position: absolute;

      left: 5.8%;
      right: 5.8%;

      top: 34%;
      bottom: 8.5%;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      grid-template-rows:
        repeat(2, 1fr);

      column-gap: 3%;
      row-gap: 6%;
    }

    .list-row {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-track {
      width: 92%;
      height: 88%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 4%;
    }

    .qty-item {
      position: relative;

      flex: 0 1 30%;

      max-width: 48px;
      max-height: 48px;

      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: .30;

      border-radius: 50%;

      transition:
        opacity .25s ease,
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .qty-item img {
      width: 96%;
      height: 96%;

      object-fit: contain;

      user-select: none;
      pointer-events: none;
    }

    .qty-item.done {
      opacity: 1;

      background:
        rgba(214,246,211,.95);

      box-shadow:
        0 0 0 3px rgba(91,177,91,.48),
        0 4px 10px rgba(0,0,0,.12);

      transform:
        scale(1.06);
    }

    .qty-item.done::after {
      content: "✓";

      position: absolute;

      right: -4px;
      top: -5px;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #61b965;
      color: white;

      font-size: 11px;
      font-weight: 900;
    }

    .list-row.one .qty-item {
      max-width: 62px;
      max-height: 62px;
      flex-basis: 40%;
    }

    .list-row.two .qty-item {
      max-width: 52px;
      max-height: 52px;
      flex-basis: 32%;
    }

    .list-row.three .qty-item {
      max-width: 43px;
      max-height: 43px;
      flex-basis: 27%;
    }

    /* =========================
       ПОКУПАТЕЛЬ
    ========================= */

    .buyer-zone {
      position: absolute;

      right: 0.2%;
      bottom: 1%;

      width: 28%;
      height: 38%;

      z-index: 20;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .buyer-img {
      width: 96%;
      max-width: none;
      max-height: 100%;

      object-fit: contain;
      object-position: bottom center;

      display: block;

      transition:
        transform .75s ease,
        opacity .75s ease;

      opacity: 1;
    }

    .buyer-img.enter {
      animation:
        buyerEnter .75s ease-out;
    }

    .buyer-img.exit {
      transform:
        translateX(130%);

      opacity: 0;
    }

    @keyframes buyerEnter {
      from {
        transform:
          translateX(130%);
        opacity: 0;
      }

      to {
        transform:
          translateX(0);
        opacity: 1;
      }
    }

    /* =========================
       КНОПКИ
    ========================= */

    .controls {
      position: absolute;

      left: 50%;
      bottom: 2%;

      transform:
        translateX(-50%);

      z-index: 50;

      display: flex;
      gap: 12px;
    }

    .btn {
      border: none;

      padding:
        14px 22px;

      border-radius: 16px;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 12px rgba(0,0,0,.14);
    }

    .btn-check {
      background: #66bb6a;
      color: white;
    }

    .btn-next {
      background: #ffca5b;
      color: #5b4027;
    }

    /* =========================
       СООБЩЕНИЯ
    ========================= */

    .message {
      position: absolute;

      left: 50%;
      top: 5%;

      transform:
        translateX(-50%);

      z-index: 100;

      background:
        rgba(255,255,255,.97);

      border-radius: 16px;

      padding:
        11px 20px;

      font-size: 18px;
      font-weight: 800;

      color:
        #7b4b2c;

      box-shadow:
        0 5px 15px rgba(0,0,0,.15);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .25s;
    }

    .message.show {
      opacity: 1;
    }

    .message.success {
      background:
        #eaf8e9;

      color:
        #32833a;
    }

    .message.error {
      background:
        #fff0ed;

      color:
        #b24d3e;
    }

    /* =========================
       ОПЛАТА
    ========================= */

    .payment-overlay {
      position: absolute;
      inset: 0;

      z-index: 200;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        rgba(255, 248, 236, .72);

      backdrop-filter: blur(4px);
    }

    .payment-overlay.show {
      display: flex;
    }

    .payment-panel {
      position: relative;

      width: min(720px, 72vw);
      height: min(500px, 68vh);

      background:
        rgba(255,255,255,.96);

      border-radius: 32px;

      box-shadow:
        0 14px 45px rgba(71, 44, 24, .22);

      border:
        4px solid #f0dcc1;

      display: flex;
      align-items: center;
      justify-content: space-evenly;

      overflow: hidden;
    }

    .payment-title {
      position: absolute;

      top: 18px;
      left: 50%;

      transform:
        translateX(-50%);

      font-size:
        clamp(24px, 2.4vw, 38px);

      font-weight: 900;

      color: #70472a;
    }

    .terminal-wrap {
      position: relative;

      width: 42%;
      height: 72%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal-img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;

      transition:
        filter .25s ease,
        transform .25s ease;
    }

    .terminal-wrap.ready {
      animation:
        terminalPulse 1.2s ease-in-out infinite;
    }

    @keyframes terminalPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    .terminal-wrap.paid .terminal-img {
      filter:
        drop-shadow(
          0 0 18px
          rgba(70, 200, 90, .75)
        );

      transform:
        scale(1.03);
    }

    .card-zone {
      position: relative;

      width: 38%;
      height: 56%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 92%;
      height: 92%;

      object-fit: contain;

      cursor: grab;

      user-select: none;
      -webkit-user-drag: none;

      touch-action: none;

      position: relative;

      z-index: 2;

      transition:
        transform .2s ease,
        filter .2s ease;
    }

    .card-img:active {
      cursor: grabbing;
    }

    .card-img.dragging {
      position: fixed;

      z-index: 500;

      pointer-events: none;

      transform:
        scale(1.05);

      filter:
        drop-shadow(
          0 10px 18px
          rgba(0,0,0,.2)
        );
    }

    .tap-hint {
      position: absolute;

      bottom: 18px;
      left: 50%;

      transform:
        translateX(-50%);

      width: 100%;

      text-align: center;

      font-size:
        clamp(17px, 1.6vw, 25px);

      font-weight: 800;

      color: #8b6749;
    }

    .paid-badge {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%,-50%)
        scale(.5);

      width: 120px;
      height: 120px;

      border-radius: 50%;

      background:
        #65c86a;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 72px;
      font-weight: 900;

      opacity: 0;

      z-index: 600;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .paid-badge.show {
      opacity: 1;

      transform:
        translate(-50%,-50%)
        scale(1);
    }

  </style>
</head>


<body>

  <div class="game">


    <div class="game-title">
      Магазин
    </div>


    <div
      class="message"
      id="message"
    >
      Готово!
    </div>


    <!-- ШКАФЫ -->

    <div class="shelves">


      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

        <div class="products-layer">

          <img src="assets/products/pik-01.png" class="product p1" data-id="pik-01" alt="">
          <img src="assets/products/pik-02.png" class="product p2" data-id="pik-02" alt="">
          <img src="assets/products/pik-03.png" class="product p3" data-id="pik-03" alt="">

          <img src="assets/products/pik-04.png" class="product p4" data-id="pik-04" alt="">
          <img src="assets/products/pik-05.png" class="product p5" data-id="pik-05" alt="">
          <img src="assets/products/pik-06.png" class="product p6" data-id="pik-06" alt="">

          <img src="assets/products/pik-07.png" class="product p7" data-id="pik-07" alt="">
          <img src="assets/products/pik-08.png" class="product p8" data-id="pik-08" alt="">
          <img src="assets/products/pik-09.png" class="product p9" data-id="pik-09" alt="">

        </div>

      </div>


      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

        <div class="products-layer">

          <img src="assets/products/pik-10.png" class="product q1" data-id="pik-10" alt="">
          <img src="assets/products/pik-11.png" class="product q2" data-id="pik-11" alt="">
          <img src="assets/products/pik-12.png" class="product q3" data-id="pik-12" alt="">

          <img src="assets/products/pik-13.png" class="product q4" data-id="pik-13" alt="">
          <img src="assets/products/pik-14.png" class="product q5" data-id="pik-14" alt="">
          <img src="assets/products/pik-15.png" class="product q6" data-id="pik-15" alt="">

          <img src="assets/products/pik-16.png" class="product q7" data-id="pik-16" alt="">
          <img src="assets/products/pik-17.png" class="product q8" data-id="pik-17" alt="">
          <img src="assets/products/pik-18.png" class="product q9" data-id="pik-18" alt="">

        </div>

      </div>


      <div class="shelf-wrap">

        <img
          src="assets/shelves/shelf-01.png"
          class="shelf"
          alt=""
        >

        <div class="products-layer">

          <img src="assets/products/pik-19.png" class="product r1" data-id="pik-19" alt="">
          <img src="assets/products/pik-20.png" class="product r2" data-id="pik-20" alt="">
          <img src="assets/products/pik-21.png" class="product r3" data-id="pik-21" alt="">

          <img src="assets/products/pik-22.png" class="product r4" data-id="pik-22" alt="">
          <img src="assets/products/pik-23.png" class="product r5" data-id="pik-23" alt="">
          <img src="assets/products/pik-24.png" class="product r6" data-id="pik-24" alt="">

          <img src="assets/products/pik-25.png" class="product r7" data-id="pik-25" alt="">
          <img src="assets/products/pik-26.png" class="product r8" data-id="pik-26" alt="">
          <img src="assets/products/pik-27.png" class="product r9" data-id="pik-27" alt="">

        </div>

      </div>

    </div>


    <!-- СПИСОК -->

    <div class="shopping-list">

      <div
        id="listItems"
        class="list-items"
      ></div>

    </div>


    <!-- ПОКУПАТЕЛЬ -->

    <div class="buyer-zone">

      <img
        id="buyerImage"
        class="buyer-img"
        src="assets/buyers/buyer-cart-01.png"
        alt=""
      >

    </div>


    <!-- КНОПКИ -->

    <div class="controls">

      <button
        id="checkBtn"
        class="btn btn-check"
      >
        Проверить
      </button>


      <button
        id="nextBtn"
        class="btn btn-next"
      >
        Следующий покупатель
      </button>

    </div>


    <!-- ОПЛАТА -->

    <div
      id="paymentOverlay"
      class="payment-overlay"
    >

      <div class="payment-panel">

        <div class="payment-title">
          Оплата
        </div>


        <div
          id="terminalWrap"
          class="terminal-wrap ready"
        >

          <img
            src="assets/ui/terminal.png"
            class="terminal-img"
            alt=""
          >

        </div>


        <div class="card-zone">

          <img
            id="paymentCard"
            src="assets/ui/card.png"
            class="card-img"
            alt=""
          >

        </div>


        <div class="tap-hint">
          Приложи карту к терминалу
        </div>


        <div
          id="paidBadge"
          class="paid-badge"
        >
          ✓
        </div>

      </div>

    </div>

  </div>


  <script>

    const BUYERS = [

      {
        image: "assets/buyers/buyer-cart-01.png",

        list: [
          { id: "pik-01", need: 1 },
          { id: "pik-11", need: 3 },
          { id: "pik-22", need: 1 },
          { id: "pik-18", need: 2 },
          { id: "pik-27", need: 1 },
          { id: "pik-10", need: 3 }
        ]
      },


      {
        image: "assets/buyers/buyer-cart-02.png",

        list: [
          { id: "pik-04", need: 1 },
          { id: "pik-13", need: 2 },
          { id: "pik-24", need: 1 },
          { id: "pik-17", need: 1 },
          { id: "pik-25", need: 2 },
          { id: "pik-02", need: 1 }
        ]
      },


      {
        image: "assets/buyers/buyer-cart-03.png",

        list: [
          { id: "pik-05", need: 1 },
          { id: "pik-08", need: 2 },
          { id: "pik-12", need: 2 },
          { id: "pik-16", need: 1 },
          { id: "pik-19", need: 1 },
          { id: "pik-26", need: 2 }
        ]
      },


      {
        image: "assets/buyers/buyer-cart-04.png",

        list: [
          { id: "pik-03", need: 1 },
          { id: "pik-06", need: 2 },
          { id: "pik-07", need: 1 },
          { id: "pik-14", need: 2 },
          { id: "pik-15", need: 1 },
          { id: "pik-23", need: 2 }
        ]
      }

    ];


    let currentBuyer = 0;
    let collected = {};

    let paymentComplete = false;
    let draggingCard = false;

    let dragOffsetX = 0;
    let dragOffsetY = 0;


    const buyerImage =
      document.getElementById("buyerImage");

    const listItems =
      document.getElementById("listItems");

    const message =
      document.getElementById("message");

    const paymentOverlay =
      document.getElementById("paymentOverlay");

    const paymentCard =
      document.getElementById("paymentCard");

    const terminalWrap =
      document.getElementById("terminalWrap");

    const paidBadge =
      document.getElementById("paidBadge");


    function resetCollected() {

      collected = {};

      BUYERS[currentBuyer].list.forEach(
        item => {

          collected[item.id] = 0;

        }
      );

    }


    function renderList() {

      const buyer =
        BUYERS[currentBuyer];

      listItems.innerHTML = "";


      buyer.list.forEach(
        item => {


          const current =
            collected[item.id] || 0;


          const row =
            document.createElement("div");


          row.className =
            "list-row";


          if (item.need === 1) {

            row.classList.add("one");

          }

          else if (item.need === 2) {

            row.classList.add("two");

          }

          else {

            row.classList.add("three");

          }


          let qtyHtml = "";


          for (
            let i = 0;
            i < item.need;
            i++
          ) {


            const doneClass =
              i < current
                ? "done"
                : "";


            qtyHtml += `

              <div class="qty-item ${doneClass}">

                <img
                  src="assets/products/${item.id}.png"
                  alt=""
                >

              </div>

            `;

          }


          row.innerHTML = `

            <div class="qty-track">

              ${qtyHtml}

            </div>

          `;


          listItems.appendChild(row);

        }
      );

    }


    function renderBuyer() {

      const buyer =
        BUYERS[currentBuyer];


      buyerImage.src =
        buyer.image;


      buyerImage.classList.remove("enter");


      void buyerImage.offsetWidth;


      buyerImage.classList.add("enter");


      resetCollected();

      renderList();

    }


    function showMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;


      message.classList.remove(
        "success",
        "error"
      );


      if (type) {

        message.classList.add(type);

      }


      message.classList.add("show");


      clearTimeout(
        showMessage.timer
      );


      showMessage.timer =
        setTimeout(
          () => {

            message.classList.remove("show");

          },
          1400
        );

    }


    function findListItem(
      productId
    ) {

      return BUYERS[currentBuyer].list.find(
        item =>
          item.id === productId
      );

    }


    function isEverythingCollected() {

      return BUYERS[currentBuyer].list.every(
        item =>
          collected[item.id] >=
          item.need
      );

    }


    document
      .querySelectorAll(".product")
      .forEach(
        product => {

          product.addEventListener(
            "click",
            () => {


              const productId =
                product.dataset.id;


              const item =
                findListItem(productId);


              if (!item) {

                product.classList.remove(
                  "wrong-shake"
                );


                void product.offsetWidth;


                product.classList.add(
                  "wrong-shake"
                );


                showMessage(
                  "Этого товара нет в списке",
                  "error"
                );


                return;

              }


              if (
                collected[productId] >=
                item.need
              ) {

                showMessage(
                  "Этот товар уже собран",
                  "error"
                );


                return;

              }


              collected[productId]++;


              product.classList.remove(
                "correct-pulse"
              );


              void product.offsetWidth;


              product.classList.add(
                "correct-pulse"
              );


              renderList();


              if (
                isEverythingCollected()
              ) {

                setTimeout(
                  () => {

                    showMessage(
                      "Все покупки собраны!",
                      "success"
                    );

                  },
                  350
                );

              }

            }
          );

        }
      );


    document
      .getElementById("checkBtn")
      .addEventListener(
        "click",
        () => {


          if (
            isEverythingCollected()
          ) {

            showMessage(
              "Всё правильно!",
              "success"
            );


            setTimeout(
              openPayment,
              650
            );

          }

          else {

            showMessage(
              "Найди остальные покупки",
              "error"
            );

          }

        }
      );


    function openPayment() {

      paymentComplete = false;


      paidBadge.classList.remove("show");

      terminalWrap.classList.remove("paid");

      terminalWrap.classList.add("ready");


      resetCardPosition();


      paymentOverlay.classList.add("show");

    }


    function closePayment() {

      paymentOverlay.classList.remove("show");

    }


    function resetCardPosition() {

      paymentCard.classList.remove("dragging");

      paymentCard.style.left = "";
      paymentCard.style.top = "";
      paymentCard.style.width = "";
      paymentCard.style.height = "";

    }


    function beginDrag(
      clientX,
      clientY
    ) {

      if (paymentComplete) {
        return;
      }


      draggingCard = true;


      const rect =
        paymentCard.getBoundingClientRect();


      dragOffsetX =
        clientX - rect.left;


      dragOffsetY =
        clientY - rect.top;


      paymentCard.style.width =
        rect.width + "px";


      paymentCard.style.height =
        rect.height + "px";


      paymentCard.classList.add("dragging");


      moveCard(
        clientX,
        clientY
      );

    }


    function moveCard(
      clientX,
      clientY
    ) {

      if (!draggingCard) {
        return;
      }


      paymentCard.style.left =
        (
          clientX -
          dragOffsetX
        ) + "px";


      paymentCard.style.top =
        (
          clientY -
          dragOffsetY
        ) + "px";

    }


    function endDrag() {

      if (!draggingCard) {
        return;
      }


      draggingCard = false;


      const cardRect =
        paymentCard.getBoundingClientRect();


      const terminalRect =
        terminalWrap.getBoundingClientRect();


      const cardCenterX =
        cardRect.left +
        cardRect.width / 2;


      const cardCenterY =
        cardRect.top +
        cardRect.height / 2;


      const insideTerminal =

        cardCenterX >= terminalRect.left &&
        cardCenterX <= terminalRect.right &&
        cardCenterY >= terminalRect.top &&
        cardCenterY <= terminalRect.bottom;


      if (insideTerminal) {

        completePayment();

      }

      else {

        resetCardPosition();

      }

    }


    function completePayment() {

      paymentComplete = true;


      paymentCard.classList.remove("dragging");


      terminalWrap.classList.remove("ready");

      terminalWrap.classList.add("paid");


      paidBadge.classList.add("show");


      setTimeout(
        () => {

          closePayment();

          nextBuyer();

        },
        1300
      );

    }


    paymentCard.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        beginDrag(
          event.clientX,
          event.clientY
        );

      }
    );


    window.addEventListener(
      "pointermove",
      event => {

        if (draggingCard) {

          event.preventDefault();

          moveCard(
            event.clientX,
            event.clientY
          );

        }

      }
    );


    window.addEventListener(
      "pointerup",
      () => {

        endDrag();

      }
    );


    function nextBuyer() {

      buyerImage.classList.add("exit");


      setTimeout(
        () => {


          currentBuyer++;


          if (
            currentBuyer >=
            BUYERS.length
          ) {

            currentBuyer = 0;

          }


          buyerImage.classList.remove("exit");


          renderBuyer();


        },
        750
      );

    }


    document
      .getElementById("nextBtn")
      .addEventListener(
        "click",
        nextBuyer
      );


    renderBuyer();

  </script>

</body>
</html>
