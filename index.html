<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Магазин</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4efe7;
    }


    /* =========================================
       ОСНОВНАЯ ИГРОВАЯ СЦЕНА
    ========================================= */

    .game {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background-image: url("fon.png");

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;
    }


    /* =========================================
       КОНТЕЙНЕР ДЛЯ ШКАФОВ
    ========================================= */

    .shelves {

      position: absolute;

      left: 3%;
      right: 3%;

      bottom: 4%;

      height: 70%;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      gap: 2%;

      z-index: 5;
    }


    /* =========================================
       ОДИН ШКАФ
    ========================================= */

    .shelf {

      width: 31%;

      height: 100%;

      object-fit: contain;

      object-position: bottom center;

      display: block;

      user-select: none;

      -webkit-user-drag: none;

      pointer-events: none;
    }


    /* =========================================
       НАЗВАНИЕ ИГРЫ
    ========================================= */

    .game-title {

      position: absolute;

      top: 2.5%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      background: rgba(255,255,255,.92);

      padding: 10px 26px;

      border-radius: 18px;

      font-size: clamp(20px, 2vw, 34px);

      font-weight: 800;

      color: #80532e;

      box-shadow:
        0 5px 14px rgba(0,0,0,.12);
    }


    /* =========================================
       ПОКА ПУСТАЯ ЗОНА ДЛЯ ПОКУПАТЕЛЯ
       пригодится дальше
    ========================================= */

    .buyer-area {

      position: absolute;

      right: 1.5%;

      bottom: 2%;

      width: 20%;

      height: 45%;

      z-index: 15;

      pointer-events: none;
    }


    /* =========================================
       АДАПТАЦИЯ
    ========================================= */

    @media (max-width: 1000px) {

      .shelves {

        left: 2%;
        right: 2%;

        gap: 1%;

        height: 66%;
      }

      .shelf {

        width: 32%;
      }

    }

  </style>
</head>


<body>

  <div class="game">


    <!-- НАЗВАНИЕ -->

    <div class="game-title">
      Магазин
    </div>


    <!-- =========================================
         ТРИ ОДИНАКОВЫХ ШКАФА
    ========================================== -->

    <div class="shelves">

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

    </div>


    <!-- МЕСТО ДЛЯ ПОКУПАТЕЛЯ С ТЕЛЕЖКОЙ -->

    <div class="buyer-area"></div>


  </div>

</body>
</html>
