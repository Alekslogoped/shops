<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Магазин</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4efe7;
    }

    /* ОСНОВНАЯ СЦЕНА */

    .game {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background-image: url("fon.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* НАЗВАНИЕ */

    .game-title {
      position: absolute;

      top: 2%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 30;

      background: rgba(255,255,255,.92);

      padding: 10px 28px;

      border-radius: 18px;

      font-size: clamp(20px, 2vw, 34px);

      font-weight: 800;

      color: #70472a;

      box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }

    /* ЗОНА ШКАФОВ */

    .shelves {
      position: absolute;

      left: 2%;

      /* ПОДНЯЛИ ШКАФЫ ВЫШЕ */
      bottom: 10%;

      width: 70%;
      height: 60%;

      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      gap: 2%;

      z-index: 5;
    }

    /* ОДИН ШКАФ */

    .shelf {
      width: 31%;
      height: 100%;

      object-fit: contain;
      object-position: bottom center;

      display: block;

      user-select: none;

      -webkit-user-drag: none;

      pointer-events: none;
    }

    /* ПРАВАЯ ЗОНА */

    .right-zone {
      position: absolute;

      right: 1.5%;
      top: 12%;
      bottom: 3%;

      width: 25%;

      z-index: 20;

      display: flex;
      flex-direction: column;

      justify-content: space-between;

      pointer-events: none;
    }

    /* СПИСОК ПОКУПОК */

    .shopping-list-placeholder {
      width: 100%;

      min-height: 180px;

      background: rgba(255,255,255,.9);

      border-radius: 20px;

      box-shadow: 0 6px 18px rgba(0,0,0,.12);

      padding: 18px;

      color: #70472a;

      text-align: center;
    }

    .shopping-list-placeholder h3 {
      margin: 0 0 10px;

      font-size: clamp(18px, 1.5vw, 26px);
    }

    .shopping-list-placeholder p {
      margin: 0;

      font-size: 15px;

      color: #8a7567;
    }

    /* ЗОНА ПОКУПАТЕЛЯ */

    .buyer-placeholder {
      position: relative;

      width: 100%;
      height: 48%;

      display: flex;

      align-items: flex-end;
      justify-content: center;
    }

    .buyer-hint {
      background: rgba(255,255,255,.85);

      border: 2px dashed #d8b58f;

      border-radius: 18px;

      padding: 16px;

      text-align: center;

      color: #7e604b;

      font-weight: 700;

      width: 90%;
    }

    /* АДАПТАЦИЯ */

    @media (max-width: 1100px) {

      .shelves {
        width: 68%;
        height: 56%;
        bottom: 10%;
      }

      .right-zone {
        width: 27%;
      }
    }

  </style>
</head>

<body>

  <div class="game">

    <div class="game-title">
      Магазин
    </div>

    <!-- ТРИ ОДИНАКОВЫХ ШКАФА -->

    <div class="shelves">

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

      <img
        src="assets/shelves/shelf-01.png"
        class="shelf"
        alt=""
      >

    </div>

    <!-- ПРАВАЯ ЗОНА -->

    <div class="right-zone">

      <div class="shopping-list-placeholder">

        <h3>Список покупок</h3>

        <p>
          Здесь будут картинки и количество
        </p>

      </div>

      <div class="buyer-placeholder">

        <div class="buyer-hint">
          Здесь будет покупатель с тележкой
        </div>

      </div>

    </div>

  </div>

</body>
</html>
